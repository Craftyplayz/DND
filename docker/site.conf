<VirtualHost *:80>
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
    </Directory>

    # The real visitor: only requests from the tunnel's path (TRUSTED_PROXY) may set CF-Connecting-IP and the scheme.
    # Anything else, e.g. a LAN request straight to the published port, keeps its own address.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPInternalProxy ${TRUSTED_PROXY}
    SetEnvIfExpr "%{CONN_REMOTE_ADDR} == '${TRUSTED_PROXY}' && (%{HTTP:X-Forwarded-Proto} == 'https' || %{HTTP:CF-Visitor} =~ /\"https\"/)" HTTPS=on

    # the live relay (live/relay.js, started by docker/start.sh): wss://<site>/live/ws?c=<campaign id>.
    # The browser's Host is kept, so the relay can check the page that opens a socket is this site's.
    ProxyPreserveHost On
    ProxyPass /live/ws ws://${LIVE_RELAY}/

    # the test site stays out of search engines
    Header always set X-Robots-Tag "noindex, nofollow" "expr=osenv('SITE_ENV') == 'test'"

    # peer address first, then the visitor address mod_remoteip settled on
    LogFormat "%{c}a %a %t \"%r\" %>s %b \"%{User-Agent}i\"" dnd
    CustomLog /proc/self/fd/1 dnd
    ErrorLog /proc/self/fd/2
</VirtualHost>
